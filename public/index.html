<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Workspace</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #1a1a1a; color: #fff; margin: 0; }
        .card { padding: 30px; background: #2a2a2a; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 80%; padding: 12px; margin: 15px 0; border: none; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; border: none; background: #4caf50; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Document Portal</h2>
        <input type="text" id="target" placeholder="Enter URL (e.g., https://example.com)">
        <br>
        <button onclick="go()">Load Page</button>
    </div>
    <script>
        function go() {
            let url = document.getElementById('target').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            window.location.href = window.location.origin + '/route/' + url;
        }
    </script>
</body>
</html>
